[project]
name = "berserkai"
version = "0.1.0"
description = "Telegram-ассистент по ККИ «Берсерк» на основе RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "httpx>=0.27",
    "openai>=1.40",
    "aiogram>=3.13",
    "ollama>=0.4",
    "gradio>=6",
]

[project.optional-dependencies]
eval = [
    "numpy>=1.26",
    "pandas>=2.2",
    "datasets>=3.0",
    "evaluate>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*", "rag*", "core*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
